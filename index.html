<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subrural - Fixed Version with Animated Ground</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
      
      .controller {
        position: absolute; 
        bottom: 40px; 
        width: 220px; 
        height: 220px; 
        z-index: 2000;
        display: grid; 
        gap: 10px; 
        pointer-events: auto;
      }
      
      #move-pad { 
        left: 20px; 
        grid-template-areas: 
          ". up ." 
          "left . right" 
          ". down ."; 
      }
      
      .btn {
        width: 70px; 
        height: 70px; 
        background: rgba(0, 0, 0, 0.6); 
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%; 
        display: flex; 
        align-items: center; 
        justify-content: center;
        font-size: 14px; 
        font-weight: bold; 
        color: white; 
        user-select: none; 
        touch-action: none;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        transition: all 0.1s ease;
      }
      
      .btn:active { 
        background: rgba(255, 255, 255, 0.9); 
        color: black; 
        transform: scale(0.95);
      }
      
      .btn.sprinting {
        background: rgba(255, 100, 100, 0.8);
        border-color: #ff0;
      }
      
      #up { grid-area: up; } 
      #left { grid-area: left; } 
      #right { grid-area: right; } 
      #down { grid-area: down; }
      
      #sprint-indicator {
        position: absolute;
        bottom: 280px;
        left: 50px;
        width: 100px;
        height: 10px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 5px;
        z-index: 2001;
        overflow: hidden;
        display: none;
      }
      
      #sprint-progress {
        width: 0%;
        height: 100%;
        background: #ffaa00;
        transition: width 0.1s linear;
      }
      
      /* Camera control instructions */
      .instructions {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 10px;
        border-radius: 5px;
        font-size: 14px;
        z-index: 2000;
        pointer-events: none;
        backdrop-filter: blur(4px);
      }
      
      /* AR/VR buttons */
      .mode-buttons {
        position: absolute;
        bottom: 40px;
        right: 20px;
        display: flex;
        gap: 10px;
        z-index: 2000;
      }
      
      .mode-btn {
        width: 60px;
        height: 60px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
        color: white;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      }
      
      @media (max-width: 400px) {
        .controller { transform: scale(0.8); left: 0; bottom: 20px; }
        #sprint-indicator { left: 30px; bottom: 240px; }
        .instructions { font-size: 12px; top: 10px; right: 10px; }
        .mode-buttons { transform: scale(0.8); right: 10px; bottom: 20px; }
      }
    </style>
  </head>
  <body>
    <!-- Sprint progress indicator -->
    <div id="sprint-indicator">
      <div id="sprint-progress"></div>
    </div>

    <!-- Camera control instructions -->
    <div class="instructions">
      Swipe: Left/Right = Rotate View<br>
      Swipe: Up/Down = Tilt Camera
    </div>

    <!-- Movement controls -->
    <div id="move-pad" class="controller">
      <div class="btn" id="up">FWD</div>
      <div class="btn" id="left">←</div>
      <div class="btn" id="right">→</div>
      <div class="btn" id="down">BWD</div>
    </div>
    
    <!-- AR/VR buttons -->
    <div class="mode-buttons">
      <div class="mode-btn">AR</div>
      <div class="mode-btn">VR</div>
    </div>

    <a-scene physics="gravity: 0; debug: false" renderer="antialias: true; colorManagement: true" vr-mode-ui="enabled: true">
      <a-assets>
        <a-asset-item id="subrural" src="Subrural.glb"></a-asset-item>
        <a-asset-item id="player" src="Player.glb"></a-asset-item>
        <a-asset-item id="ground" src="Ground.glb"></a-asset-item>
        
        <!-- Fallback colors if models don't load -->
        <img id="player-texture" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
      </a-assets>

      <!-- Environment -->
      <a-entity gltf-model="#subrural" 
                position="0 0 0"
                static-body
                id="environment-collision"></a-entity>
      
      <!-- Animated Ground -->
      <a-entity gltf-model="#ground" 
                position="0 0 0" 
                static-body
                shadow="receive: true"
                animation-mixer="clip: idle">
      </a-entity>
      
      <a-sky color="#87CEEB"></a-sky>

      <!-- Player Rig -->
      <a-entity id="player-rig" 
                position="0 1.5 0"> <!-- Raised starting position -->
        
        <!-- Primary Player Model (attempts to load gltf) -->
        <a-entity id="player-model" 
                  gltf-model="#player" 
                  scale="0.0062 0.0062 0.00862" <!-- Larger scale for visibility -->
                  rotation="0 0 0"
                  visible="true"
                  animation-mixer="clip: idle; crossFadeDuration: 0.2">
        </a-entity>
        
        <!-- FALLBACK PLAYER - This will be visible if the gltf doesn't load -->
        <a-entity id="player-fallback" visible="false">
          <!-- Body (green) -->
          <a-sphere color="#4CAF50" radius="0.8" position="0 1.2 0"></a-sphere>
          <!-- Head (yellow) -->
          <a-sphere color="#FFC107" radius="0.4" position="0 2.2 0"></a-sphere>
          <!-- Arms -->
          <a-cylinder color="#4CAF50" radius="0.15" height="1.2" position="-0.9 1.6 0" rotation="0 0 20"></a-cylinder>
          <a-cylinder color="#4CAF50" radius="0.15" height="1.2" position="0.9 1.6 0" rotation="0 0 -20"></a-cylinder>
          <!-- Legs -->
          <a-cylinder color="#2E7D32" radius="0.2" height="1.2" position="-0.4 0.6 0"></a-cylinder>
          <a-cylinder color="#2E7D32" radius="0.2" height="1.2" position="0.4 0.6 0"></a-cylinder>
          <!-- Eyes (white) -->
          <a-sphere color="white" radius="0.1" position="-0.2 2.3 0.3"></a-sphere>
          <a-sphere color="white" radius="0.1" position="0.2 2.3 0.3"></a-sphere>
          <!-- Pupils (black) -->
          <a-sphere color="black" radius="0.05" position="-0.2 2.3 0.4"></a-sphere>
          <a-sphere color="black" radius="0.05" position="0.2 2.3 0.4"></a-sphere>
        </a-entity>

        <!-- Camera positioned higher behind the player -->
        <a-entity id="camera-rig" position="0 5 8" rotation="0 180 0"> <!-- Higher and further back -->
          <a-entity id="camera" 
                    camera 
                    look-controls="pointerLockEnabled: false; enabled: false"
                    wasd-controls="enabled: false">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Lighting -->
      <a-entity light="type: ambient; intensity: 1.2"></a-entity> <!-- Brighter ambient -->
      <a-entity light="type: directional; intensity: 1.2; castShadow: true" 
                position="5 15 5" 
                target="0 1 0">
      </a-entity>
      
      <!-- Add a second light from behind to illuminate player back -->
      <a-entity light="type: directional; intensity: 0.8; color: #FFFFFF" 
                position="-5 10 -5" 
                target="0 1 0">
      </a-entity>
    </a-scene>

    <script>
      (function() {
        // Wait for scene to load
        const scene = document.querySelector('a-scene');
        if (!scene) {
          console.error('Scene not found');
          return;
        }

        scene.addEventListener('loaded', () => {
          console.log('Scene loaded, initializing controls...');
          
          // Get references with null checks
          const rig = document.getElementById('player-rig');
          const model = document.getElementById('player-model');
          const fallback = document.getElementById('player-fallback');
          const cameraRig = document.getElementById('camera-rig');
          const sprintProgress = document.getElementById('sprint-progress');
          const sprintIndicator = document.getElementById('sprint-indicator');
          
          if (!rig || !model || !cameraRig || !fallback) {
            console.error('Required elements not found');
            return;
          }

          // FORCE FALLBACK FOR TESTING - Comment this out if you want to try loading the actual model
          // Uncomment the line below to force using the fallback character
          // showFallbackCharacter();
          
          // Movement state
          let moveKeys = { up: false, down: false, left: false, right: false };
          let isRunning = false;
          let sprintCharge = 0;
          const SPRINT_DELAY = 3000;
          const BOUNDARY = 45;
          
          // Camera control state
          let cameraRotation = { x: 25, y: 180 }; // Increased tilt
          let touchStart = { x: 0, y: 0 };
          let isTouching = false;
          const SENSITIVITY = 0.5;
          
          let sprintTimers = { up: null, down: null, left: null, right: null };
          let lastTime = performance.now();
          let currentAnim = 'idle';
          let modelLoaded = false;
          
          // Function to show fallback character and hide gltf model
          function showFallbackCharacter() {
            console.log('Showing fallback character');
            model.setAttribute('visible', 'false');
            fallback.setAttribute('visible', 'true');
            modelLoaded = true; // Consider it loaded for animation purposes
          }
          
          // Button setup
          const setupButton = (id, key) => {
            const el = document.getElementById(id);
            if (!el) return;
            
            const start = (e) => {
              e.preventDefault();
              e.stopPropagation();
              moveKeys[key] = true;
              
              if (sprintIndicator) sprintIndicator.style.display = 'block';
              
              if (!sprintTimers[key]) {
                sprintTimers[key] = setTimeout(() => {
                  isRunning = true;
                  el.classList.add('sprinting');
                  sprintCharge = 100;
                  if (sprintProgress) sprintProgress.style.width = '100%';
                }, SPRINT_DELAY);
              }
              
              const startTime = Date.now();
              const updateProgress = () => {
                if (moveKeys[key] && !isRunning) {
                  const elapsed = Date.now() - startTime;
                  const progress = Math.min(100, (elapsed / SPRINT_DELAY) * 100);
                  if (sprintProgress) sprintProgress.style.width = progress + '%';
                  requestAnimationFrame(updateProgress);
                }
              };
              updateProgress();
            };
            
            const end = (e) => {
              e.preventDefault();
              e.stopPropagation();
              moveKeys[key] = false;
              
              if (!moveKeys.up && !moveKeys.down && !moveKeys.left && !moveKeys.right) {
                if (sprintIndicator) sprintIndicator.style.display = 'none';
              }
              
              if (sprintTimers[key]) {
                clearTimeout(sprintTimers[key]);
                sprintTimers[key] = null;
              }
              
              if (!moveKeys.up && !moveKeys.down) {
                isRunning = false;
                el.classList.remove('sprinting');
                sprintCharge = 0;
                if (sprintProgress) sprintProgress.style.width = '0%';
              }
            };
            
            el.addEventListener('touchstart', start, { passive: false });
            el.addEventListener('touchend', end, { passive: false });
            el.addEventListener('touchcancel', end, { passive: false });
            el.addEventListener('mousedown', start);
            el.addEventListener('mouseup', end);
            el.addEventListener('mouseleave', end);
          };

          setupButton('up', 'up');
          setupButton('down', 'down');
          setupButton('left', 'left');
          setupButton('right', 'right');

          // Keyboard controls
          window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
              case 'w': moveKeys.up = true; e.preventDefault(); break;
              case 's': moveKeys.down = true; e.preventDefault(); break;
              case 'a': moveKeys.left = true; e.preventDefault(); break;
              case 'd': moveKeys.right = true; e.preventDefault(); break;
              case 'arrowleft': cameraRotation.y += 2; updateCameraRotation(); e.preventDefault(); break;
              case 'arrowright': cameraRotation.y -= 2; updateCameraRotation(); e.preventDefault(); break;
              case 'arrowup': cameraRotation.x = Math.min(45, cameraRotation.x + 2); updateCameraRotation(); e.preventDefault(); break;
              case 'arrowdown': cameraRotation.x = Math.max(5, cameraRotation.x - 2); updateCameraRotation(); e.preventDefault(); break;
            }
          });
          
          window.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
              case 'w': moveKeys.up = false; e.preventDefault(); break;
              case 's': moveKeys.down = false; e.preventDefault(); break;
              case 'a': moveKeys.left = false; e.preventDefault(); break;
              case 'd': moveKeys.right = false; e.preventDefault(); break;
            }
            
            if (!moveKeys.up && !moveKeys.down) {
              isRunning = false;
              document.querySelectorAll('.btn').forEach(btn => btn.classList.remove('sprinting'));
            }
          });

          // Touch controls for camera
          document.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('btn')) return;
            isTouching = true;
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
          }, { passive: true });

          document.addEventListener('touchmove', (e) => {
            if (!isTouching || e.target.classList.contains('btn')) return;
            e.preventDefault();
            
            const touchEnd = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
            
            const deltaX = touchEnd.x - touchStart.x;
            const deltaY = touchEnd.y - touchStart.y;
            
            cameraRotation.y += deltaX * SENSITIVITY;
            cameraRotation.x = Math.max(5, Math.min(45, cameraRotation.x - deltaY * SENSITIVITY));
            cameraRotation.y = cameraRotation.y % 360;
            
            updateCameraRotation();
            touchStart = touchEnd;
          }, { passive: false });

          document.addEventListener('touchend', () => {
            isTouching = false;
          });

          // Mouse drag for camera
          let isMouseDown = false;
          let mouseStart = { x: 0, y: 0 };

          document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('btn')) return;
            isMouseDown = true;
            mouseStart.x = e.clientX;
            mouseStart.y = e.clientY;
          });

          document.addEventListener('mousemove', (e) => {
            if (!isMouseDown || e.target.classList.contains('btn')) return;
            
            const deltaX = e.clientX - mouseStart.x;
            const deltaY = e.clientY - mouseStart.y;
            
            cameraRotation.y += deltaX * SENSITIVITY * 0.5;
            cameraRotation.x = Math.max(5, Math.min(45, cameraRotation.x - deltaY * SENSITIVITY * 0.5));
            cameraRotation.y = cameraRotation.y % 360;
            
            updateCameraRotation();
            mouseStart.x = e.clientX;
            mouseStart.y = e.clientY;
          });

          document.addEventListener('mouseup', () => {
            isMouseDown = false;
          });

          function updateCameraRotation() {
            cameraRig.setAttribute('rotation', {
              x: cameraRotation.x,
              y: cameraRotation.y,
              z: 0
            });
          }

          // Animation function (simplified for fallback)
          const updateAnimation = (newAnim) => {
            if (newAnim !== currentAnim) {
              currentAnim = newAnim;
              console.log('Animation:', newAnim);
              
              // If using fallback, we could animate the limbs here
              // For now, just log
            }
          };

          // Simple collision detection
          function checkCollision(newPosition) {
            const buildingZones = [
              { x: [-10, 10], z: [-15, -5] },
              { x: [15, 25], z: [10, 20] },
              { x: [-25, -15], z: [15, 25] },
              { x: [-5, 5], z: [20, 30] },
            ];
            
            const buffer = 2.0;
            
            for (let zone of buildingZones) {
              if (newPosition.x > zone.x[0] - buffer && 
                  newPosition.x < zone.x[1] + buffer && 
                  newPosition.z > zone.z[0] - buffer && 
                  newPosition.z < zone.z[1] + buffer) {
                return true;
              }
            }
            
            if (Math.abs(newPosition.x) > BOUNDARY || Math.abs(newPosition.z) > BOUNDARY) {
              return true;
            }
            
            return false;
          }

          // Main game loop
          function tick() {
            if (!rig) return;
            
            const now = performance.now();
            const delta = Math.min(32, now - lastTime) / 16;
            lastTime = now;
            
            try {
              let rotation = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
              
              if (moveKeys.left) rotation.y += 2.5 * delta;
              if (moveKeys.right) rotation.y -= 2.5 * delta;
              
              rotation.y = rotation.y % 360;
              if (rotation.y < 0) rotation.y += 360;
              
              rig.setAttribute('rotation', rotation);
              
              let position = rig.getAttribute('position') || { x: 0, y: 1.5, z: 0 };
              
              const baseSpeed = 0.15;
              const runSpeed = 0.3;
              let speed = (isRunning ? runSpeed : baseSpeed) * delta;
              
              let targetAnim = 'idle';
              let moved = false;
              
              if (moveKeys.up || moveKeys.down) {
                const direction = moveKeys.up ? 1 : -1;
                const angleRad = rotation.y * (Math.PI / 180);
                
                let newX = position.x - Math.sin(angleRad) * speed * direction;
                let newZ = position.z - Math.cos(angleRad) * speed * direction;
                
                if (!checkCollision({ x: newX, z: newZ })) {
                  position.x = newX;
                  position.z = newZ;
                  moved = true;
                }
                
                targetAnim = direction === 1 
                  ? (isRunning ? 'run-forward' : 'walk-forward')
                  : (isRunning ? 'run-backwards' : 'walk-backwards');
              }
              
              position.y = 1.5; // Keep fixed height
              rig.setAttribute('position', position);
              
              updateAnimation(moved ? targetAnim : 'idle');
              
            } catch (error) {
              console.error('Error in game loop:', error);
            }
            
            requestAnimationFrame(tick);
          }

          tick();

          // Handle model loading
          model.addEventListener('model-loaded', () => {
            console.log('Player model loaded successfully - keeping gltf model');
            model.setAttribute('visible', 'true');
            fallback.setAttribute('visible', 'false');
            modelLoaded = true;
          });

          model.addEventListener('model-error', (error) => {
            console.error('Failed to load player model, using fallback:', error);
            showFallbackCharacter();
          });

          // Set a timeout to show fallback if model takes too long to load
          setTimeout(() => {
            if (!modelLoaded) {
              console.log('Model load timeout - using fallback');
              showFallbackCharacter();
            }
          }, 3000);

          // Initial camera rotation
          updateCameraRotation();
          
          console.log('Controls initialized');
        });
      })();
    </script>
  </body>
</html>
