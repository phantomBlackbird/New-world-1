<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Subrural - Joystick Controls & Cinematic Camera</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.9.0/dist/nipplejs.min.js"></script>
    
    <style>
      body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
      
      /* Joystick container */
      #joystick-container {
        position: absolute;
        bottom: 40px;
        left: 40px;
        width: 150px;
        height: 150px;
        z-index: 2000;
        pointer-events: auto;
      }
      
      /* Sprint button */
      #sprint-btn {
        position: absolute;
        bottom: 40px;
        right: 40px;
        width: 80px;
        height: 80px;
        background: rgba(0, 0, 0, 0.7);
        border: 3px solid rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: bold;
        color: white;
        z-index: 2000;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        transition: all 0.2s ease;
        pointer-events: auto;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      
      #sprint-btn.active {
        background: rgba(255, 100, 100, 0.9);
        border-color: #ff0;
        transform: scale(1.1);
        box-shadow: 0 0 20px rgba(255, 100, 100, 0.8);
      }
      
      /* Sprint progress indicator */
      #sprint-progress-container {
        position: absolute;
        bottom: 130px;
        right: 40px;
        width: 80px;
        height: 8px;
        background: rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        z-index: 2001;
        overflow: hidden;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.3);
      }
      
      #sprint-progress {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #ffaa00, #ff5500);
        transition: width 0.1s linear;
        border-radius: 4px;
      }
      
      /* Camera control instructions */
      .instructions {
        position: absolute;
        top: 20px;
        right: 20px;
        background: rgba(0, 0, 0, 0.6);
        color: white;
        padding: 15px;
        border-radius: 10px;
        font-size: 14px;
        z-index: 2000;
        pointer-events: none;
        backdrop-filter: blur(4px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      }
      
      .instructions span {
        color: #ffaa00;
        font-weight: bold;
      }
      
      /* Action buttons container (for future use) */
      #action-buttons {
        position: absolute;
        bottom: 40px;
        right: 140px;
        display: flex;
        gap: 15px;
        z-index: 2000;
      }
      
      .action-btn {
        width: 60px;
        height: 60px;
        background: rgba(0, 0, 0, 0.6);
        border: 2px solid rgba(255, 255, 255, 0.8);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        backdrop-filter: blur(4px);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        transition: all 0.2s ease;
        pointer-events: auto;
      }
      
      .action-btn:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.3);
      }
      
      @media (max-width: 400px) {
        #joystick-container { transform: scale(0.8); left: 20px; bottom: 20px; }
        #sprint-btn { transform: scale(0.8); right: 20px; bottom: 20px; }
        #sprint-progress-container { right: 20px; bottom: 110px; }
        .instructions { font-size: 12px; padding: 10px; }
        #action-buttons { right: 120px; transform: scale(0.8); }
      }
    </style>
  </head>
  <body>
    <!-- Joystick container -->
    <div id="joystick-container"></div>
    
    <!-- Sprint button -->
    <div id="sprint-btn">SPRINT</div>
    
    <!-- Sprint progress -->
    <div id="sprint-progress-container">
      <div id="sprint-progress"></div>
    </div>
    
    <!-- Action buttons (placeholder for future) -->
    <div id="action-buttons">
      <div class="action-btn">⚔️</div>
      <div class="action-btn">🛡️</div>
    </div>

    <!-- Camera control instructions -->
    <div class="instructions">
      <span>👆</span> Drag screen to rotate camera<br>
      <span>🕹️</span> Left joystick to move<br>
      <span>⚡</span> Hold SPRINT to run
    </div>

    <a-scene physics="gravity: 0; debug: false" renderer="antialias: true; colorManagement: true; physicallyCorrectLights: true" vr-mode-ui="enabled: true">
      <a-assets>
        <a-asset-item id="subrural" src="Subrural.glb"></a-asset-item>
        <a-asset-item id="player" src="Player.glb"></a-asset-item>
        <a-asset-item id="ground" src="Ground.glb"></a-asset-item>
      </a-assets>

      <!-- Environment -->
      <a-entity gltf-model="#subrural" 
                position="0 0 0"
                static-body
                id="environment-collision"></a-entity>
      
      <!-- Animated Ground -->
      <a-entity gltf-model="#ground" 
                position="0 0 0" 
                static-body
                shadow="receive: true"
                animation-mixer="clip: idle">
      </a-entity>
      
      <a-sky color="#87CEEB"></a-sky>

      <!-- Player Rig -->
      <a-entity id="player-rig" 
                position="0 1.5 0">
        
        <!-- Player Model - 3x bigger than before (0.008 * 3 = 0.024) -->
        <a-entity id="player-model" 
                  gltf-model="#player" 
                  scale="0.024 0.024 0.024"
                  rotation="0 0 0"
                  visible="true"
                  animation-mixer="clip: idle; crossFadeDuration: 0.2">
        </a-entity>
        
        <!-- Fallback player (only shows if gltf fails) -->
        <a-entity id="player-fallback" visible="false">
          <a-sphere color="#4CAF50" radius="0.8" position="0 1.2 0"></a-sphere>
          <a-sphere color="#FFC107" radius="0.4" position="0 2.2 0"></a-sphere>
          <a-cylinder color="#4CAF50" radius="0.15" height="1.2" position="-0.9 1.6 0" rotation="0 0 20"></a-cylinder>
          <a-cylinder color="#4CAF50" radius="0.15" height="1.2" position="0.9 1.6 0" rotation="0 0 -20"></a-cylinder>
          <a-cylinder color="#2E7D32" radius="0.2" height="1.2" position="-0.4 0.6 0"></a-cylinder>
          <a-cylinder color="#2E7D32" radius="0.2" height="1.2" position="0.4 0.6 0"></a-cylinder>
        </a-entity>

        <!-- CINEMATIC THIRD-PERSON CAMERA -->
        <!-- Camera rig that follows player with smooth cinematic positioning -->
        <a-entity id="camera-rig" 
                  position="0 6 12"  <!-- Height: 6, Distance: 12 -->
                  rotation="0 180 0">
          <a-entity id="camera" 
                    camera 
                    look-controls="pointerLockEnabled: false; enabled: false"
                    wasd-controls="enabled: false">
          </a-entity>
        </a-entity>
      </a-entity>

      <!-- Cinematic Lighting -->
      <a-entity light="type: ambient; intensity: 1.0"></a-entity>
      
      <!-- Key light (main illumination) -->
      <a-entity light="type: directional; intensity: 1.2; castShadow: true" 
                position="5 15 10" 
                target="0 1.5 0">
      </a-entity>
      
      <!-- Fill light (from behind) -->
      <a-entity light="type: directional; intensity: 0.6; color: #B0C4DE" 
                position="-5 10 -10" 
                target="0 1.5 0">
      </a-entity>
      
      <!-- Rim light (for edge highlighting) -->
      <a-entity light="type: directional; intensity: 0.8; color: #FFFACD" 
                position="0 8 -15" 
                target="0 1.5 0">
      </a-entity>
      
      <!-- Add some atmospheric fog for depth -->
      <a-entity fog="type: exponential; color: #87CEEB; density: 0.015"></a-entity>
    </a-scene>

    <script>
      (function() {
        const scene = document.querySelector('a-scene');
        if (!scene) return;

        scene.addEventListener('loaded', () => {
          console.log('Scene loaded, initializing joystick controls...');
          
          const rig = document.getElementById('player-rig');
          const model = document.getElementById('player-model');
          const fallback = document.getElementById('player-fallback');
          const cameraRig = document.getElementById('camera-rig');
          const sprintBtn = document.getElementById('sprint-btn');
          const sprintProgress = document.getElementById('sprint-progress');
          
          if (!rig || !model || !cameraRig) return;

          // Movement state
          let moveDirection = { x: 0, y: 0 }; // Joystick input (-1 to 1)
          let isSprinting = false;
          let sprintCharge = 100;
          let canSprint = true;
          const SPRINT_DRAIN_RATE = 25; // % per second
          const SPRINT_RECHARGE_RATE = 15; // % per second
          
          // Camera state
          let cameraRotation = { x: 25, y: 180 }; // Cinematic angle
          let touchStart = { x: 0, y: 0 };
          let isTouching = false;
          const CAMERA_SENSITIVITY = 0.3;
          
          // Animation state
          let currentAnim = 'idle';
          let modelLoaded = false;
          
          // Frame timing
          let lastTime = performance.now();
          
          // BOUNDARY
          const BOUNDARY = 45;

          // Initialize joystick
          const joystick = nipplejs.create({
            zone: document.getElementById('joystick-container'),
            mode: 'static',
            position: { left: '50%', top: '50%' },
            color: 'white',
            size: 120,
            lockY: false,
            lockX: false,
            restOpacity: 0.7,
            fadeTime: 100
          });

          // Joystick events
          joystick.on('move', (evt, nipple) => {
            const vector = nipple.vector;
            // Normalize and invert Y if needed
            moveDirection.x = vector.x;
            moveDirection.y = -vector.y; // Invert so up = forward
          });

          joystick.on('end', () => {
            moveDirection = { x: 0, y: 0 };
          });

          // Sprint button events
          sprintBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (canSprint && sprintCharge > 0) {
              isSprinting = true;
              sprintBtn.classList.add('active');
            }
          });

          sprintBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            isSprinting = false;
            sprintBtn.classList.remove('active');
          });

          sprintBtn.addEventListener('mousedown', (e) => {
            e.preventDefault();
            if (canSprint && sprintCharge > 0) {
              isSprinting = true;
              sprintBtn.classList.add('active');
            }
          });

          sprintBtn.addEventListener('mouseup', (e) => {
            e.preventDefault();
            isSprinting = false;
            sprintBtn.classList.remove('active');
          });

          sprintBtn.addEventListener('mouseleave', (e) => {
            e.preventDefault();
            isSprinting = false;
            sprintBtn.classList.remove('active');
          });

          // Camera touch controls
          document.addEventListener('touchstart', (e) => {
            if (e.target.classList.contains('action-btn') || e.target.id === 'sprint-btn') return;
            isTouching = true;
            touchStart.x = e.touches[0].clientX;
            touchStart.y = e.touches[0].clientY;
          }, { passive: true });

          document.addEventListener('touchmove', (e) => {
            if (!isTouching || e.target.classList.contains('action-btn') || e.target.id === 'sprint-btn') return;
            e.preventDefault();
            
            const touchEnd = {
              x: e.touches[0].clientX,
              y: e.touches[0].clientY
            };
            
            const deltaX = touchEnd.x - touchStart.x;
            const deltaY = touchEnd.y - touchStart.y;
            
            // Update camera rotation with cinematic limits
            cameraRotation.y += deltaX * CAMERA_SENSITIVITY;
            cameraRotation.x = Math.max(15, Math.min(45, cameraRotation.x - deltaY * CAMERA_SENSITIVITY));
            cameraRotation.y = cameraRotation.y % 360;
            
            updateCameraRotation();
            touchStart = touchEnd;
          }, { passive: false });

          document.addEventListener('touchend', () => {
            isTouching = false;
          });

          // Mouse drag for camera (desktop)
          let isMouseDown = false;
          let mouseStart = { x: 0, y: 0 };

          document.addEventListener('mousedown', (e) => {
            if (e.target.classList.contains('action-btn') || e.target.id === 'sprint-btn') return;
            isMouseDown = true;
            mouseStart.x = e.clientX;
            mouseStart.y = e.clientY;
          });

          document.addEventListener('mousemove', (e) => {
            if (!isMouseDown || e.target.classList.contains('action-btn') || e.target.id === 'sprint-btn') return;
            
            const deltaX = e.clientX - mouseStart.x;
            const deltaY = e.clientY - mouseStart.y;
            
            cameraRotation.y += deltaX * CAMERA_SENSITIVITY * 0.3;
            cameraRotation.x = Math.max(15, Math.min(45, cameraRotation.x - deltaY * CAMERA_SENSITIVITY * 0.3));
            cameraRotation.y = cameraRotation.y % 360;
            
            updateCameraRotation();
            mouseStart.x = e.clientX;
            mouseStart.y = e.clientY;
          });

          document.addEventListener('mouseup', () => {
            isMouseDown = false;
          });

          function updateCameraRotation() {
            cameraRig.setAttribute('rotation', {
              x: cameraRotation.x,
              y: cameraRotation.y,
              z: 0
            });
          }

          // Collision detection
          function checkCollision(newPosition) {
            const buildingZones = [
              { x: [-10, 10], z: [-15, -5] },
              { x: [15, 25], z: [10, 20] },
              { x: [-25, -15], z: [15, 25] },
              { x: [-5, 5], z: [20, 30] },
            ];
            
            const buffer = 2.5;
            
            for (let zone of buildingZones) {
              if (newPosition.x > zone.x[0] - buffer && 
                  newPosition.x < zone.x[1] + buffer && 
                  newPosition.z > zone.z[0] - buffer && 
                  newPosition.z < zone.z[1] + buffer) {
                return true;
              }
            }
            
            return Math.abs(newPosition.x) > BOUNDARY || Math.abs(newPosition.z) > BOUNDARY;
          }

          // Animation update
          function updateAnimation(animName) {
            if (!modelLoaded) return;
            
            if (animName !== currentAnim) {
              model.setAttribute('animation-mixer', `clip: ${animName}; crossFadeDuration: 0.2`);
              currentAnim = animName;
            }
          }

          // Main game loop
          function tick() {
            const now = performance.now();
            const delta = Math.min(32, now - lastTime) / 1000; // Convert to seconds
            lastTime = now;
            
            try {
              // Update sprint
              if (isSprinting && sprintCharge > 0) {
                sprintCharge = Math.max(0, sprintCharge - SPRINT_DRAIN_RATE * delta);
                if (sprintCharge <= 0) {
                  isSprinting = false;
                  sprintBtn.classList.remove('active');
                  canSprint = false;
                  setTimeout(() => { canSprint = true; }, 500);
                }
              } else {
                sprintCharge = Math.min(100, sprintCharge + SPRINT_RECHARGE_RATE * delta);
              }
              
              sprintProgress.style.width = sprintCharge + '%';
              
              // Get current rotation and position
              let rotation = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
              let position = rig.getAttribute('position') || { x: 0, y: 1.5, z: 0 };
              
              // Calculate movement from joystick
              if (Math.abs(moveDirection.x) > 0.1 || Math.abs(moveDirection.y) > 0.1) {
                // Calculate speed
                const baseSpeed = 2.5; // Units per second
                const sprintSpeed = 5.0;
                const speed = (isSprinting && sprintCharge > 0 ? sprintSpeed : baseSpeed) * delta;
                
                // Get camera direction for movement relative to camera view
                const cameraAngle = (cameraRotation.y * Math.PI) / 180;
                
                // Calculate movement directions based on camera orientation
                // Forward/backward relative to camera
                const forwardX = -Math.sin(cameraAngle);
                const forwardZ = -Math.cos(cameraAngle);
                
                // Right/left relative to camera
                const rightX = Math.cos(cameraAngle);
                const rightZ = -Math.sin(cameraAngle);
                
                // Combine joystick input with camera directions
                let moveX = (forwardX * moveDirection.y + rightX * moveDirection.x) * speed;
                let moveZ = (forwardZ * moveDirection.y + rightZ * moveDirection.x) * speed;
                
                // Calculate new position
                let newX = position.x + moveX;
                let newZ = position.z + moveZ;
                
                // Check collision
                if (!checkCollision({ x: newX, z: newZ })) {
                  position.x = newX;
                  position.z = newZ;
                }
                
                // Rotate player to face movement direction
                if (Math.abs(moveDirection.x) > 0.1 || Math.abs(moveDirection.y) > 0.1) {
                  const moveAngle = Math.atan2(moveX, moveZ);
                  rotation.y = (moveAngle * 180) / Math.PI;
                }
                
                // Determine animation
                const speed magnitude = Math.sqrt(moveDirection.x * moveDirection.x + moveDirection.y * moveDirection.y);
                if (magnitude > 0.5) {
                  updateAnimation(isSprinting ? 'run-forward' : 'walk-forward');
                } else {
                  updateAnimation('walk-forward');
                }
              } else {
                updateAnimation('idle');
              }
              
              // Keep Y position fixed
              position.y = 1.5;
              
              // Update rig
              rig.setAttribute('rotation', rotation);
              rig.setAttribute('position', position);
              
            } catch (error) {
              console.error('Error:', error);
            }
            
            requestAnimationFrame(tick);
          }

          // Handle model loading
          model.addEventListener('model-loaded', () => {
            console.log('Player model loaded');
            model.setAttribute('visible', 'true');
            fallback.setAttribute('visible', 'false');
            modelLoaded = true;
          });

          model.addEventListener('model-error', () => {
            console.log('Using fallback model');
            model.setAttribute('visible', 'false');
            fallback.setAttribute('visible', 'true');
            modelLoaded = true;
          });

          // Start game loop
          tick();
          updateCameraRotation();
          
          console.log('Joystick controls initialized');
        });
      })();
    </script>
  </body>
            </html>
